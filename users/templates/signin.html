<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGN IN</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    
    <form action="/users/signin/" method="POST">
        {% csrf_token %}
        <div id="signin" class="buttons">
            <img src="{% static 'img/TASK_LOGO.png' %}" alt="logo" width="250" id="signin_logo">
            <br>
            {{form}}
            <br>
            <button class="button"><span>LOG IN</span></button>
        </div>
    </form>

</body>
</html>
